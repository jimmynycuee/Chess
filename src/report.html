<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>賽後復盤</title>
<link rel="stylesheet" href="report.css?v=20261023d">
<!-- 網頁版（手機）才會用到；在插件裡不做任何事 -->
<script src="../web/chrome-shim.js?v=20261023d"></script>
<meta name="theme-color" content="#262421">
<link rel="icon" type="image/png" href="../web/icons/favicon.png">
<link rel="apple-touch-icon" href="../web/icons/apple-touch-icon.png">
<!-- 在這頁「加入主畫面」時，起始頁仍然是對局列表 -->
<link rel="manifest" href="../web/manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="賽後復盤">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body>
  <header class="topbar">
    <a class="web-only back-link" href="../web/" title="回到對局列表">‹ 對局</a>
    <div class="brand">♞ <span>賽後復盤</span></div>
    <div class="game-meta">
      <div id="title" class="game-title">載入中…</div>
      <div id="sub" class="muted small"></div>
      <div id="piece-notice" class="muted small" hidden>還沒取得 chess.com 的棋子：打開 chess.com 任一盤棋後就會自動換成你的 chess.com 棋子樣式。</div>
    </div>
    <div class="actions">
      <div class="seg" id="me-toggle" role="group" aria-label="我執哪一方">
        <span class="muted small">我是</span>
        <button data-me="w">白方</button>
        <button data-me="b">黑方</button>
      </div>
      <button id="flip" class="ghost" title="翻轉棋盤">翻轉棋盤</button>
      <button id="copy" class="ghost" disabled>複製摘要</button>
      <button id="pgn" class="ghost" disabled>匯出 PGN</button>
    </div>
  </header>

  <div id="progress" class="progress"><div class="progress-bar"></div><span class="progress-text">準備引擎…</span></div>

  <main id="app" hidden>
    <section class="board-area">
      <div class="player" id="player-top"></div>
      <div class="board-wrap">
        <div class="evalbar" id="evalbar" title="勝率">
          <div class="eval-white"></div>
          <span class="eval-text"></span>
        </div>
        <div id="board" class="board"></div>
      </div>
      <div class="player" id="player-bottom"></div>
    </section>

    <aside class="side">
      <nav class="tabs" role="tablist">
        <button data-tab="review" class="on">復盤</button>
        <button data-tab="summary">總結</button>
        <button data-tab="opening">Opening</button>
        <button data-tab="stats">統計</button>
      </nav>

      <div class="tab-body">
        <div class="tab" data-tab="review">
          <div class="coach" id="coach">
            <div class="coach-head">
              <span class="coach-avatar">♞</span>
              <div id="coach-title" class="coach-title"></div>
              <label class="switch" title="一直顯示 Best Move（會記住）"><input type="checkbox" id="best-toggle"><span class="knob"></span>Best Move</label>
            </div>
            <div id="coach-body" class="coach-body"></div>
          </div>
          <div id="chart" class="chart"></div>
          <details id="moves-box" class="moves-box" open>
            <summary>著法列表</summary>
            <div id="moves" class="moves"></div>
          </details>
        </div>

        <div class="tab" data-tab="summary" hidden>
          <section class="cards" id="cards"></section>
          <section class="block">
            <h2>這盤棋的故事</h2>
            <div id="story" class="story"></div>
          </section>
          <section class="block">
            <h2>Opening・Middlegame・Endgame</h2>
            <div id="phases" class="phases"></div>
          </section>
          <section class="block">
            <h2>你下得好的地方</h2>
            <ul id="goods" class="goods"></ul>
          </section>
          <section class="block">
            <h2>本局最重要的課</h2>
            <div id="lessons" class="lessons"></div>
          </section>
        </div>

        <div class="tab" data-tab="opening" hidden>
          <div id="opening"></div>
        </div>

        <div class="tab" data-tab="stats" hidden>
          <section class="block">
            <h2>錯誤統計</h2>
            <div id="stats"></div>
          </section>
          <section class="block">
            <h2>下一步練什麼 <span class="muted small">Lichess 免費主題謎題</span></h2>
            <div id="suggest" class="suggest-list"></div>
          </section>
          <section class="block">
            <h2>對手的失誤 <span class="muted small">你有沒有抓住機會？</span></h2>
            <ul id="opp" class="opp"></ul>
          </section>
        </div>
      </div>

      <footer class="controls">
        <button data-nav="first" title="開頭（Home）"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5v14" /><path d="M18 6l-7 6 7 6" /></svg></button>
        <button data-nav="prev" title="上一步（←）"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6" /></svg></button>
        <button id="play" title="播放：遇到關鍵時刻會停下來（空白鍵）">
          <svg class="i-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5l11 7-11 7z" class="fill" /></svg>
          <svg class="i-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14M16 5v14" /></svg>
        </button>
        <button data-nav="next" title="下一步（→）"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6" /></svg></button>
        <button data-nav="last" title="最後（End）"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17 5v14" /><path d="M6 6l7 6-7 6" /></svg></button>
      </footer>
    </aside>
  </main>
  <script type="module" src="report.js?v=20261023d"></script>
</body>
</html>
